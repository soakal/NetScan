# ---- NetScan configuration --------------------------------------------------
# Copy to config.yaml and edit. Only `targets` is strictly required.

# Networks / hosts to scan. CIDR, ranges, or single IPs.
targets:
  - 192.168.1.0/24
  # - 10.0.0.10-50
  # - 10.0.0.5

# Addresses to skip (e.g. fragile devices, the scanner host itself).
exclude:
  # - 192.168.1.254

# Scan aggressiveness / noise level. Run `python run.py profiles` to list.
#   light     quiet, top-100 ports, polite timing  (default, least likely to
#             trip IDS/EDR — detection only, never exploitation)
#   standard  top-1000 ports + light OS detection
#   thorough  all ports + full version + OS detection (noisy; use a window)
scan_profile: light

# --- Threat-intel data sources ---
# NVD CVE API key (optional but recommended; raises rate limit 10x).
# Get a free key: https://nvd.nist.gov/developers/request-an-api-key
# Can also be set via env var NETSCAN_NVD_API_KEY.
nvd_api_key: null

# VirusTotal API key (optional). Enables IP-reputation enrichment.
# Env var: NETSCAN_VT_API_KEY
vt_api_key: null
vt_check_host_ips: false   # set true to look up each live host IP on VirusTotal

# KEV (CISA) and EPSS (FIRST.org) need no key.

# --- Credentialed (authenticated) scanning ---
# Log into hosts you OWN with a least-privilege account and read an accurate
# software/patch inventory. Quietest + most accurate scan mode: a normal
# management login running read-only queries (no exploitation, no changes).
#   SSH (Linux/Unix/network gear): pip install paramiko
#   WinRM (Windows):               pip install pywinrm
#
# SECURITY: prefer SSH keys or `password_env` over inline passwords, and keep
# this file out of version control (chmod 600). Use a dedicated read-only
# service account, not a domain admin.
#
# Host identity: credentialed scans VERIFY SSH host keys / WinRM TLS certs by
# default (strict_host_keys: true). For a first lab scan without known_hosts or
# trusted certs, set strict_host_keys: false (MITM risk — only on trusted nets).
credentialed: false
strict_host_keys: true

# WinRM remote Windows inventory. ON by default so NetScan can pull OS /
# hotfix / software inventory when you cannot log into each Windows PC by hand.
# Set false only if you want to disable WinRM entirely.
winrm_enabled: true

credentials:
  # - name: linux-fleet
  #   type: ssh
  #   username: scansvc
  #   key_file: ~/.ssh/scan_ed25519     # or use password_env below
  #   password_env: NETSCAN_SSH_PASS    # reads the password from this env var
  #   port: 22
  #   match: ["192.168.1.0/24"]         # which hosts this cred applies to
  #
  # - name: windows-fleet
  #   type: winrm
  #   username: 'SCANDOMAIN\svc-scan'
  #   password_env: NETSCAN_WINRM_PASS
  #   scheme: https                     # https=5986 (recommended), http=5985
  #   match: ["192.168.10.0/24"]
  #
  # An empty `match: []` (or omitting it) applies the credential to every host
  # of that type. The first matching credential wins.

# --- Accurate credentialed matching backends ---
# OVAL: use distro security feeds (Ubuntu/Debian/RHEL family) to assess Linux
#       packages with backport awareness — compares the installed version to the
#       distro's *fixed* version, eliminating the false positives you get from
#       generic version/CPE matching. No key needed.
oval_matching: true
# MSRC: Microsoft CVE->KB missing-patch detection. Used when WinRM inventory
#       is enabled (winrm_enabled: true) and a WinRM credential exists.
msrc_matching: true
msrc_months: 3            # how many recent patch-Tuesday months to pull/correlate
msrc_api_key: null        # optional; env var NETSCAN_MSRC_API_KEY

# --- Storage / cache ---
db_path: netscan.db
cache_dir: .netscan_cache
kev_cache_hours: 24
nvd_cache_hours: 168

# --- Web report ---
web_host: 127.0.0.1   # keep on localhost unless you intend to expose it
web_port: 8000
